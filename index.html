<!doctype html>
<html lang="__LANG__">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="__THEME_COLOR__" />
    <meta name="robots" content="index,follow" />

    <title>__TITULO__</title>
    <meta name="description" content="__DESCRIPCION__" />
    __CANONICAL__

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="__NOMBRE__" />
    <meta property="og:title" content="__OG_TITULO__" />
    <meta property="og:description" content="__OG_DESCRIPCION__" />
    <meta property="og:url" content="__URL__" />
    <meta property="og:image" content="__OG_IMAGE__" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="__OG_TITULO__" />
    <meta property="og:locale" content="__OG_LOCALE__" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="__OG_TITULO__" />
    <meta name="twitter:description" content="__OG_DESCRIPCION__" />
    <meta name="twitter:image" content="__OG_IMAGE__" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/og-image.png" />

    <!-- Tipografías: preconnect + display=swap para no bloquear el pintado -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap"
    />

    <!-- La foto del hero empieza a bajar antes de que arranque el JS -->
    <link rel="preconnect" href="https://images.pexels.com" crossorigin />

    <!-- JSON-LD generado con código desde src/config/seo.js -->
    <script type="application/ld+json">
      __JSONLD__
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!--
      ⚠️ Trampa 2: el respaldo <noscript><img></noscript> del Pixel va AQUÍ,
      en el <body>. Dentro de <head> Vite falla al compilar.
      El plugin solo lo inyecta si hay un Meta Pixel ID configurado.
    -->
    __PIXEL_NOSCRIPT__
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
